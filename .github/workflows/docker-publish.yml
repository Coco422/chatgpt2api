name: Publish Docker Image

# 上游原版只在 v* tag 时构建，且只构建主服务镜像。
# 本 fork 的调整：
#   1. main 分支 push 也构建并产出 latest（否则每次都要先打 tag）
#   2. 新增 sentinel_solver 镜像的构建 job（2026-10 生图修复必需）
#   3. 平台收窄到 linux/amd64（部署机是 x86_64，省掉 QEMU 跨架构构建）
#      —— 如后续需要 arm64，把 platforms 加回 linux/amd64,linux/arm64 即可

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: chatgpt2api
  SOLVER_IMAGE_NAME: chatgpt2api-sentinel-solver

jobs:
  # ── 主服务镜像 ───────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── sentinel 求解服务镜像 ────────────────────────────────────
  # 常驻无头 Chromium，替主服务算 Turnstile。
  # Dockerfile 里只做 pip install，Chromium 是**容器启动时**下载的，
  # 所以这里构建很快、镜像很小，CI 不需要跑浏览器。
  sentinel-solver:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sentinel solver
        uses: docker/build-push-action@v6
        with:
          context: ./sentinel_solver
          file: ./sentinel_solver/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.SOLVER_IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.SOLVER_IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
